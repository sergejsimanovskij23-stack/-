<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIX — крипто-трейдинг</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0B1A;--sf:#14162B;--sf2:#1B1E3A;--ln:#262A52;--vi:#7C5CFF;--cy:#29D3E6;--up:#22D39A;--dn:#FF5C7A;--tx:#EDEEFF;--mu:#8A8FB8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-weight:500}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{max-width:480px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,.hd{font-family:Unbounded,Manrope,sans-serif;font-weight:700}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;font-family:Unbounded;font-weight:700;font-size:17px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;margin-bottom:14px;background:linear-gradient(135deg,#3A2A9E,#1B1E5C 55%,#0E4A66)}
.hero svg{position:absolute;right:-30px;top:-20px;opacity:.9}
.hero .big{font-family:Unbounded;font-size:30px;margin:6px 0 4px;position:relative}
.hero .mu{color:#C5C8F0;position:relative;font-size:13px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.act{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--tx)}
.act i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.row .g{flex:1;min-width:0}.row b{display:block;font-size:15px}.row small{color:var(--mu);font-size:12px}
.r{text-align:right}
.ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex:none;box-shadow:inset 0 -6px 12px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.35)}
.ic svg{width:100%;height:100%}
.sec{font-family:Unbounded;font-size:15px;margin:18px 2px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
nav div{display:flex;width:100%;max-width:460px;background:var(--sf2);border:1px solid var(--ln);border-radius:22px;padding:6px}
nav button{flex:1;background:0;border:0;color:var(--mu);font:700 11px Manrope;padding:8px 0;border-radius:16px}
nav button i{display:block;font-style:normal;font-size:19px}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--vi),#5B7CFF)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ln);color:var(--tx);border-radius:30px;padding:6px 12px 6px 6px;font:700 13px Manrope}
.chip .ic{width:24px;height:24px;font-size:12px}
.chip.on{border-color:var(--vi);background:#241F5C}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:0;color:var(--mu);font:800 14px Manrope;padding:11px;border-radius:11px}
.seg .b.on{background:var(--up);color:#032}.seg .s.on{background:var(--dn);color:#fff}
.inp{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:14px;color:var(--tx);font:700 20px Manrope;padding:14px;outline:0}
.inp:focus{border-color:var(--vi)}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.pcts button{background:var(--sf2);border:0;color:var(--tx);border-radius:10px;padding:9px;font:700 13px Manrope}
.cta{width:100%;border:0;border-radius:16px;padding:16px;font:800 16px Manrope;color:#fff;background:linear-gradient(135deg,var(--vi),var(--cy))}
.cta.b{background:var(--up);color:#032}.cta.s{background:var(--dn)}
.claim{border:0;border-radius:12px;padding:9px 14px;font:800 13px Manrope;background:var(--vi);color:#fff}
.claim:disabled{background:var(--sf2);color:var(--mu)}
.bar{height:6px;border-radius:6px;background:var(--sf2);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy))}
canvas{width:100%;height:190px;display:block}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px}
.stat b{font-family:Unbounded;font-size:16px;display:block;margin-top:4px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-120px);transition:.35s;background:var(--sf2);border:1px solid var(--vi);padding:12px 16px;border-radius:16px;font-weight:700;font-size:14px;z-index:9;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
@media (prefers-color-scheme:light){:root{}}
</style></head>
<body>
<div id="app"><div style="padding:40px 20px;text-align:center;color:#8A8FB8;font-family:system-ui">Загрузка ORBIX…</div></div>
<div id="toast"></div>
<nav><div id="nav"></div></nav>
<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=2)=>n.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const pd=p=>p<.001?8:p<1?4:2;
const C=[
{s:'BTC',n:'Bitcoin',p:67250,v:.0016,a:'#F7931A',b:'#FFB84D',g:'₿'},
{s:'ETH',n:'Ethereum',p:3480,v:.002,a:'#5B6CFF',b:'#A7B0FF',g:'Ξ'},
{s:'BNB',n:'BNB',p:598,v:.0018,a:'#E6A700',b:'#FFD54A',g:'B'},
{s:'SOL',n:'Solana',p:172,v:.0028,a:'#9945FF',b:'#14F195',g:'◎'},
{s:'XRP',n:'XRP',p:.62,v:.0024,a:'#1B2A4A',b:'#4A78C2',g:'✕'},
{s:'TON',n:'Toncoin',p:6.9,v:.0026,a:'#0088CC',b:'#4FD1FF',g:'T'},
{s:'DOGE',n:'Dogecoin',p:.158,v:.0035,a:'#C9A227',b:'#F5DC7A',g:'Ð'},
{s:'VOID',n:'VoidCoin',p:1.37,v:.011,a:'#000',b:'#7C5CFF',g:'',n2:1}];
C.forEach(c=>{c.h=[c.p];for(let i=0;i<59;i++){c.h.unshift(c.h[0]*(1+(Math.random()-.5)*c.v*2))}c.o=c.h[0];c.p=c.h[59]});
const M=Object.fromEntries(C.map(c=>[c.s,c]));
let S={cash:100,inv:100,v:2,card:0,pend:[],hist:[],wdn:0,wm:'out',wa:'',cf:'USDT',ct:'BTC',ca:'',hold:{},xp:0,trades:0,done:{},ps:0,bv:0,day:'',streak:0,stk:0,wh:0,name:'Трейдер #'+(1000+Math.floor(Math.random()*9000)),tab:'home',sel:'BTC',side:'b',amt:''};
try{const l=JSON.parse(localStorage.getItem('orbix')||'null');if(l&&l.v==2)Object.assign(S,l,{tab:'home',amt:''})}catch(e){}
const save=()=>{try{localStorage.setItem('orbix',JSON.stringify(S))}catch(e){}};
const tot=()=>S.cash+S.stk+Object.entries(S.hold).reduce((a,[k,h])=>a+h.q*M[k].p,0);
const chg=c=>(c.p/c.o-1)*100;
const lvl=()=>Math.floor(S.xp/150)+1;
function icon(c,sz){const st=sz?`style="width:${sz}px;height:${sz}px"`:'';
if(c.n2)return `<span class="ic" ${st} style="background:#000;box-shadow:0 0 14px #7C5CFF99;${sz?`width:${sz}px;height:${sz}px`:''}"><svg viewBox="0 0 40 40"><defs><radialGradient id="vg"><stop offset=".45" stop-color="#000"/><stop offset=".6" stop-color="#7C5CFF"/><stop offset="1" stop-color="#29D3E6" stop-opacity="0"/></radialGradient></defs><circle cx="20" cy="20" r="19" fill="url(#vg)"/><ellipse cx="20" cy="20" rx="17" ry="5" fill="none" stroke="#C9B8FF" stroke-width="1.6" transform="rotate(-20 20 20)"/><circle cx="20" cy="20" r="7" fill="#000"/></svg></span>`;
return `<span class="ic" style="background:linear-gradient(135deg,${c.a},${c.b});${sz?`width:${sz}px;height:${sz}px`:''}">${c.g}</span>`}
function spark(c){const h=c.h.slice(-30),mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;
const pts=h.map((v,i)=>`${(i/29*70).toFixed(1)},${(26-(v-mn)/r*24).toFixed(1)}`).join(' ');
return `<svg width="70" height="28"><polyline points="${pts}" fill="none" stroke="${chg(c)>=0?'#22D39A':'#FF5C7A'}" stroke-width="2" stroke-linejoin="round"/></svg>`}
const pill=c=>{const x=chg(c);return `<span class="${x>=0?'up':'dn'}">${x>=0?'+':''}${fmt(x)}%</span>`};
function coinRow(c,clk){return `<div class="row" onclick="${clk}"><span>${icon(c)}</span><div class="g"><b>${c.s}</b><small>${c.n}</small></div>${spark(c)}<div class="r" style="min-width:86px"><b>$${fmt(c.p,pd(c.p))}</b><small>${pill(c)}</small></div></div>`}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
function addXP(n){const a=lvl();S.xp+=n;if(lvl()>a){toast('🎉 Новый уровень: '+lvl());try{ORBIX_NOTIFY.level(lvl())}catch(e){}}}

const TASKS=[
{id:1,t:'Первая сделка',d:'Купи или продай любую монету',r:200,p:()=>[Math.min(S.trades,1),1]},
{id:2,t:'Загляни в бездну',d:'Купи VOIDCOIN',r:500,p:()=>[S.bv?1:0,1]},
{id:3,t:'Активный трейдер',d:'Соверши 5 сделок',r:300,p:()=>[Math.min(S.trades,5),5]},
{id:4,t:'Диверсификация',d:'Держи 3 разные монеты',r:400,p:()=>[Math.min(Object.keys(S.hold).length,3),3]},
{id:5,t:'Фиксируй прибыль',d:'Продай монету дороже, чем купил',r:350,p:()=>[Math.min(S.ps,1),1]},
{id:6,t:'Крупный игрок',d:'Доведи капитал до $12 000',r:1000,p:()=>[Math.min(Math.floor(tot()),12000),12000]},
{id:7,t:'Профи рынка',d:'Соверши 20 сделок',r:800,p:()=>[Math.min(S.trades,20),20]},
{id:8,t:'Пассивный доход',d:'Положи USDT в стейкинг',r:300,p:()=>[S.stk>0?1:0,1]},
{id:9,t:'Не пропадай',d:'Заходи 3 дня подряд',r:600,p:()=>[Math.min(S.streak,3),3]}];
function claim(id){const t=TASKS.find(x=>x.id==id);const[a,b]=t.p();if(a<b||S.done[id])return;S.done[id]=1;S.cash+=t.r;addXP(80);toast('+$'+t.r+' за задание «'+t.t+'»');try{ORBIX_NOTIFY.task(t.t,t.r)}catch(e){}save();render()}
function daily(){const d=new Date().toDateString();if(S.day===d)return;const y=new Date(Date.now()-864e5).toDateString();S.streak=S.day===y?S.streak+1:1;S.day=d;const r=100+((S.streak-1)%7)*50;S.cash+=r;addXP(20);toast('🔥 Серия '+S.streak+' дн. Бонус: +$'+r);save();render()}

const SUB=['tasks','wheel','stake','rank','prof'];
const BOTS=[['Satoshi_Jr',31200],['WhaleAlert',24800],['MoonBoy',18300],['HODLqueen',15100],['VoidRider',12600],['DiamondHands',10900],['ПампДжо',9300],['Новичок77',7800]].map(([n,c])=>({n,c}));
function spin(){if(Date.now()-S.wh<144e5)return;S.wh=Date.now();const p=[50,100,150,250,500,1000][Math.floor(Math.random()**2*6)];S.cash+=p;addXP(15);toast('🎡 Колесо: +$'+p);save();render()}
function stake(){if(S.cash<1)return toast('Нет свободных USDT');S.stk+=S.cash;S.cash=0;toast('Деньги в стейкинге, доход растёт');save();render()}
function unstake(){S.cash+=S.stk;S.stk=0;save();render()}
function holdRows(){return Object.entries(S.hold).map(([k,h])=>{const c=M[k],v=h.q*c.p,pl=v-h.cost,pc=pl/h.cost*100,u=pl>=0;return `<div class="row" onclick="pick('${k}')"><span>${icon(c)}</span><div class="g"><b>${fmt(h.q,4)} ${k}</b><small>Куплено по $${fmt(h.cost/h.q,pd(c.p))} · сейчас $${fmt(c.p,pd(c.p))}</small></div><div class="r"><b>$${fmt(v)}</b><small class="${u?'up':'dn'}">${u?'▲ +':'▼ -'}$${fmt(Math.abs(pl))} (${fmt(pc)}%)</small></div></div>`}).join('')}
function hook(){const rd=Date.now()-S.wh>=144e5,dn=S.day===new Date().toDateString();const[i,t]=rd?['🎡','Бесплатное колесо готово. Крути!']:!dn?['🎁','Забери бонус дня и продли серию']:['🔥','Серия '+S.streak+' дн. Загляни завтра за бонусом больше'];return `<div class="card" onclick="go('wheel')" style="display:flex;gap:12px;align-items:center;border-color:var(--vi)"><span style="font-size:30px">${i}</span><b>${t}</b></div>`}
function go(t){S.tab=t;render();scrollTo(0,0)}
function pick(s){S.sel=s;S.tab='trade';S.amt='';render();scrollTo(0,0)}
function side(x){S.side=x;S.amt='';render()}
function pct(p){const c=M[S.sel];const mx=S.side=='b'?S.cash:(S.hold[S.sel]?S.hold[S.sel].q*c.p:0);S.amt=String(Math.floor(mx*p/100*100)/100);render()}
function setAmt(v){S.amt=v;updTrade()}
function exec(){const c=M[S.sel],a=parseFloat(S.amt);if(!(a>0))return toast('Введи сумму в USDT');
if(S.side=='b'){if(a>S.cash+.001)return toast('Недостаточно USDT');const q=a*.999/c.p,h=S.hold[c.s]||{q:0,cost:0};h.q+=q;h.cost+=a;S.hold[c.s]=h;S.cash-=a;if(c.s=='VOID')S.bv=1;toast(`Куплено ${fmt(q,4)} ${c.s}`)}
else{const h=S.hold[c.s];if(!h)return toast('У тебя нет '+c.s);const q=Math.min(h.q,a/c.p),get=q*c.p*.999,cost=h.cost*(q/h.q);if(get>cost)S.ps++;h.q-=q;h.cost-=cost;if(h.q<1e-9)delete S.hold[c.s];S.cash+=get;toast(`Продано ${fmt(q,4)} ${c.s} за $${fmt(get)}`)}
S.trades++;addXP(10);S.hist.unshift({t:Date.now(),x:(S.side=='b'?'Покупка ':'Продажа ')+c.s+' на $'+fmt(a)});EV.unshift({t:Date.now(),u:ME,s:c.s,b:S.side=='b',q:a/c.p,usd:a});S.amt='';save();render()}

function drawChart(){const cv=$('#cv');if(!cv)return;const c=M[S.sel],dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
const d=c.h,mn=Math.min(...d),mx=Math.max(...d),r=(mx-mn)||1,col=chg(c)>=0?'#22D39A':'#FF5C7A';
x.strokeStyle='#262A5280';x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}
const X=i=>i/(d.length-1)*(w-4)+2,Y=v=>h-12-(v-mn)/r*(h-30);
x.beginPath();d.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.strokeStyle=col;x.lineWidth=2.5;x.lineJoin='round';x.stroke();
x.lineTo(w,h);x.lineTo(0,h);const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');x.fillStyle=g;x.fill();
x.beginPath();x.arc(X(d.length-1),Y(d[d.length-1]),4,0,7);x.fillStyle=col;x.fill()}
function updTrade(){const c=M[S.sel];const p=$('#tp');if(!p)return;p.textContent='$'+fmt(c.p,pd(c.p));$('#tc').innerHTML=pill(c);drawChart();
const a=parseFloat(S.amt)||0;$('#get').textContent=S.side=='b'?`≈ ${fmt(a*.999/c.p,4)} ${c.s}`:`≈ $${fmt(a*.999)} (комиссия 0,1%)`}

const hero=`<svg width="190" height="190" viewBox="0 0 190 190"><defs><radialGradient id="hg"><stop offset="0" stop-color="#29D3E6" stop-opacity=".9"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient></defs><circle cx="105" cy="85" r="80" fill="url(#hg)" opacity=".5"/><ellipse cx="105" cy="85" rx="85" ry="26" fill="none" stroke="#fff" stroke-opacity=".3" transform="rotate(-18 105 85)"/><ellipse cx="105" cy="85" rx="60" ry="18" fill="none" stroke="#fff" stroke-opacity=".4" transform="rotate(-18 105 85)"/><circle cx="105" cy="85" r="26" fill="#05060F"/><circle cx="165" cy="62" r="7" fill="#FFB84D"/></svg>`;
function avatar(){const h=(S.name.length*47)%360;return `<svg class="av" viewBox="0 0 84 84"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="hsl(${h},80%,60%)"/><stop offset="1" stop-color="#29D3E6"/></linearGradient></defs><circle cx="42" cy="42" r="42" fill="url(#ag)"/><circle cx="42" cy="34" r="14" fill="#0A0B1A"/><path d="M14 74c4-18 14-22 28-22s24 4 28 22z" fill="#0A0B1A"/></svg>`}
const ttl=()=>{const l=lvl();return l<3?'Новичок':l<6?'Трейдер':l<10?'Кит':'Легенда рынка'};

function view(){
const T=tot(),pnl=T-S.inv;
if(S.tab=='home'){
const hs=Object.entries(S.hold).map(([k,h])=>{const c=M[k],v=h.q*c.p,pl=v-h.cost;return `<div class="row" onclick="pick('${k}')"><span>${icon(c)}</span><div class="g"><b>${fmt(h.q,4)} ${k}</b><small class="${pl>=0?'up':'dn'}">${pl>=0?'+':''}$${fmt(pl)}</small></div><div class="r"><b>$${fmt(v)}</b></div></div>`}).join('')||'<p class="mu" style="padding:10px 0">Пока пусто. Купи первую монету на вкладке «Торговля».</p>';
const mv=[...C].sort((a,b)=>Math.abs(chg(b))-Math.abs(chg(a))).slice(0,3).map(c=>coinRow(c,`pick('${c.s}')`)).join('');
return `<div class="top"><div class="logo"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="none" stroke="#7C5CFF" stroke-width="3"/><circle cx="14" cy="14" r="5" fill="#29D3E6"/></svg>ORBIX</div><span class="mu">Ур. ${lvl()} · ${ttl()}</span></div>
<div class="hero">${hero}<div class="mu">Общий капитал</div><div class="big">$${fmt(T)}</div><div class="mu">Доступно: $${fmt(S.cash)} USDT · <b class="${pnl>=0?'up':'dn'}">${pnl>=0?'+':''}${fmt(pnl)}</b></div></div>
<div class="acts"><div class="act" onclick="pick('BTC')"><i>📈</i>Торговля</div><div class="act" onclick="pick('VOID')"><i>🕳️</i>VOID</div><div class="act" onclick="go('conv')"><i>🔄</i>Обмен</div><div class="act" onclick="S.wm='out';go('wd')"><i>💳</i>На карту</div></div>
${hook()}<div class="sec">Мои активы</div><div class="card">${holdRows()||'<p class="mu">Пока пусто. Купи первую монету!</p>'}</div>
<div class="sec">Самые активные</div><div class="card">${mv}</div>`}
if(S.tab=='port'){const iv=Object.values(S.hold).reduce((a,h)=>a+h.cost,0),val=T-S.cash-S.stk,pl=val-iv,u=pl>=0;const bar=Object.entries(S.hold).map(([k,h])=>`<i style="width:${h.q*M[k].p/val*100}%;background:${M[k].b}"></i>`).join('');

          S.cash = (S.cash||0) + (+payload.a||0);
          S.inv = (S.inv||0) + (+payload.a||0);
          S.hist = S.hist||[];
          S.hist.unshift({t:Date.now(),x:'💸 Получено $'+Number(payload.a).toFixed(2)+' от '+payload.fromName});
          if(typeof save==='function')save();
          toastOn('💸 '+payload.fromName+' перевёл тебе $'+Number(payload.a).toFixed(2)); try{ORBIX_NOTIFY.transferIn(payload.fromName,payload.a)}catch(e){}
          if(typeof render==='function')render();
        }
        if(payload.from===myId && payload.act==='ack'){
          toastOn('✅ Перевод доставлен');
        }
      });
      ch.on('broadcast',{event:'chat'},({payload})=>{
        if(!payload||payload.id===myId)return;
        toastOn('💬 '+payload.n+': '+String(payload.m||'').slice(0,80));
      });
      await new Promise((resolve,reject)=>{
        ch.subscribe(async (status)=>{
          if(status==='SUBSCRIBED'){
            onlineOn=true;
            await trackPresence();
            resolve();
          } else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') reject(new Error(status));
        });
      });
      onlineReady=true;
      toastOn('🟢 Ты в сети · реальных трейдеров: '+O.count()); try{ORBIX_NOTIFY.online(O.count())}catch(e){}
      if(typeof render==='function')render();
      // periodic presence refresh (respect rate limit: max 5 / 30s)
      setInterval(()=>{if(onlineOn)trackPresence()}, 12000);
    }catch(e){
      console.error(e);
      onlineOn=false;
      console.warn('orbix online',e); toastOn('Сеть: повтор через 5с'); setTimeout(()=>{try{connect()}catch(e){}},5000);
    }
  }

  async function trackPresence(){
    if(!ch||!onlineOn)return;
    try{
      const holdSummary={};
      Object.entries(S.hold||{}).forEach(([k,h])=>{holdSummary[k]=+(h.q||0).toFixed(6)});
      await ch.track({
        n: safeName(S.name),
        c: Math.floor(typeof tot==='function'?tot():(S.cash||0)),
        fl: '🇷🇺',
        t: Date.now(),
        hold: holdSummary
      });
    }catch(e){}
  }

  async function disconnect(){
    if(!ch)return;
    try{await ch.untrack()}catch(e){}
    try{await sb.removeChannel(ch)}catch(e){}
    ch=null; onlineOn=false; O.players={};
    toastOn('Отключён от сети');
    if(typeof render==='function')render();
  }

  function publishTrade(s,b,q,usd){
    if(!onlineOn||!ch)return;
    ch.send({type:'broadcast',event:'trade',payload:{id:myId,n:safeName(S.name),fl:'🇷🇺',s,b,q:+q,usd:+usd,t:Date.now()}});
  }

  async function sendMoney(toId, toName, amount){
    amount=Math.floor(+amount);
    if(!onlineOn||!ch) return toastOn('Сначала войди в онлайн');
    if(!(amount>=1)) return toastOn('Минимум $1');
    if(amount>(S.cash||0)+1e-9) return toastOn('Недостаточно USDT');
    if(!toId) return toastOn('Выбери получателя');
    if(!confirm('Отправить $'+amount+' игроку '+toName+'?\n(реальный перевод внутри сети ORBIX)'))return;
    S.cash-=amount; S.inv-=amount;
    S.hist=S.hist||[]; S.hist.unshift({t:Date.now(),x:'Перевод $'+amount+' → '+toName});
    if(typeof save==='function')save();
    await ch.send({type:'broadcast',event:'transfer',payload:{act:'send',from:myId,fromName:safeName(S.name),to:toId,a:amount,t:Date.now()}});
    toastOn('✅ Отправлено $'+amount); try{ORBIX_NOTIFY.transferOut(toName,amount)}catch(e){}
    if(typeof render==='function')render();
  }

  function requestMoney(){}

  // Replace fake feed with real+fallback
  window.realFeedHTML = function(filter, n=15){
    const rows = O.feed.filter(e=>!filter||e.s===filter).slice(0,n);
    if(!rows.length){
      return '<p class="mu" style="padding:8px 0">Пока нет сделок. Купи или продай монету — сделка появится у всех в сети.</p>';
    }
    return rows.map(e=>{
      const avHtml = (typeof av==='function') ? av(e.u.n,34) : '<span class="ic" style="background:#333">👤</span>';
      return `<div class="row" style="padding:8px 0"><span>${avHtml}</span><div class="g"><b style="font-size:14px">${e.u.n} ${e.u.fl||''} <span class="up" style="font-size:10px">●</span></b><small>${new Date(e.t).toLocaleTimeString('ru-RU')}</small></div><div class="r"><b class="${e.b?'up':'dn'}" style="font-size:13px">${e.b?'Купил':'Продал'} ${(e.q<1?e.q.toFixed(4):e.q.toFixed(2))} ${e.s}</b><small>$${Number(e.usd).toFixed(2)}</small></div></div>`;
    }).join('');
  };

  window.realTradersHTML = function(){
    const L=O.list();
    if(!onlineOn) return '<div class="card"><p class="mu">🔄 Подключение к сети…</p></div>';
    if(!L.length) return '<div class="card"><p class="mu">Пока ты один. Открой эту страницу с другого устройства или позови друга — он появится здесь.</p></div>';
    return `<div class="card">${L.map((u,i)=>`<div class="row" onclick="S.toId='${u.id}';S.to='${u.n.replace(/'/g,"\\'")}';go('send')"><b style="width:26px">${i+1}</b>${typeof av==='function'?av(u.n,38):''}<div class="g"><b>${u.n} ${u.fl||''}</b><small class="up">● онлайн · UID ${u.id.slice(0,6)}</small></div><b>$${Number(u.c).toLocaleString('ru-RU',{maximumFractionDigits:0})}</b></div>`).join('')}</div>`;
  };

  // Hook into existing exec after trade
  const _exec = window.exec;
  // Will be bound after functions defined
  window.__orbixOnlineHook = function(){
    // patch exec
    if(typeof exec==='function'){
      const orig=exec;
      window.exec=function(){
        const side=S.side, sel=S.sel, amt=parseFloat(S.amt);
        orig.apply(this,arguments);
        if(onlineOn && amt>0 && M[sel]){
          const q = side==='b' ? (amt*0.999/M[sel].p) : Math.min((S.hold[sel]?S.hold[sel].q:0), amt/M[sel].p);
          publishTrade(sel, side==='b', q, amt);
          trackPresence();
          try{ORBIX_NOTIFY.trade(side==='b', sel, amt)}catch(e){}
        }
      };
    }
  };
})();
